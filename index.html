<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Fortuna — Luck fades. A plan doesn't.</title>
<style>
  :root{
    --bg:#05070a; --bg2:#0a0d12; --card:#0f1319; --card2:#161b22;
    --line:#242c37; --text:#f2f5fa; --muted:#8b95a6; --dim:#5f6a7c;
    --accent:#0a6df5; --accent2:#0453c4; --good:#22c55e; --bad:#ef4444;
    --warn:#f59e0b; --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#000; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px; line-height:1.5;}
  body{display:flex; justify-content:center;}
  #phone{width:100%; max-width:480px; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; box-shadow:0 0 60px rgba(0,0,0,.6);}
  .site-tabs{position:sticky; top:0; z-index:40; display:grid; grid-template-columns:1fr 1fr;
    gap:4px; padding:8px; background:rgba(5,7,10,.97); border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);}
  .site-tab{min-height:40px; border:1px solid transparent; border-radius:11px; background:transparent;
    color:var(--muted); font:700 13px/1 inherit; letter-spacing:.02em; cursor:pointer;
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .08s ease;}
  .site-tab:hover{color:var(--text); background:var(--card);}
  .site-tab:active{transform:scale(.98);}
  .site-tab.on{color:#fff; background:var(--accent); border-color:#3288ff;}
  .site-tab:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  header#topbar{position:sticky; top:57px; z-index:20; background:rgba(5,7,10,.93);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:14px 16px; display:flex; align-items:center; gap:10px;}
  header#topbar .ttl{font-weight:700; font-size:18px; letter-spacing:.2px;}
  header#topbar .sub{color:var(--muted); font-size:12px;}
  .backbtn{background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:12px; width:38px; height:38px; font-size:18px; display:flex;
    align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;}
  main#view{flex:1; padding:16px 16px 96px; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
  nav#tabbar{position:fixed; bottom:0; width:100%; max-width:480px; z-index:30;
    background:rgba(10,13,18,.97); backdrop-filter:blur(12px); border-top:1px solid var(--line);
    display:grid; grid-template-columns:repeat(5,1fr); padding:8px 4px 12px;}
  nav#tabbar button{background:none; border:0; color:var(--dim); font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
    font-weight:600; padding:4px 0; font-family:inherit;}
  nav#tabbar button .ic{font-size:20px; line-height:1;}
  nav#tabbar button.on{color:var(--accent);}
  h2{font-size:22px; margin:4px 0 10px;}
  h3{font-size:17px; margin:16px 0 8px;}
  p{margin:0 0 12px; color:#d5deee;}
  .muted{color:var(--muted);} .dim{color:var(--dim);} .small{font-size:13px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin:0 0 12px;}
  .card.tap{cursor:pointer; transition:transform .08s ease, border-color .1s;}
  .card.tap:active{transform:scale(.985);}
  .row{display:flex; align-items:center; gap:12px;}
  .between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .grow{flex:1; min-width:0;}
  .pill{display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px;
    font-weight:700; background:var(--card2); color:var(--accent); border:1px solid var(--line);}
  .pill.gray{color:var(--muted);}
  .pill.warn{color:var(--warn);}
  .pill.good{color:var(--good);} .pill.bad{color:var(--bad);}
  .btn{display:block; width:100%; padding:15px; border-radius:14px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:16px; font-weight:700; cursor:pointer;
    font-family:inherit; margin:0 0 10px; text-align:center;}
  .btn:active{transform:scale(.99);}
  .btn.primary{background:var(--accent); color:#ffffff; border-color:var(--accent);}
  .btn.ghost{background:transparent;}
  .btn.danger{background:transparent; color:var(--bad); border-color:#5b2330;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btnrow{display:flex; gap:10px;} .btnrow .btn{margin-bottom:0;}
  .bar{height:8px; border-radius:999px; background:var(--card2); overflow:hidden; margin:8px 0 2px;}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent));}
  .prog{font-size:12px; color:var(--muted);}
  input,select,textarea{width:100%; padding:13px; border-radius:12px; border:1px solid var(--line);
    background:#0d1729; color:var(--text); font-size:16px; font-family:inherit; margin:0 0 12px;}
  label{display:block; font-size:13px; font-weight:700; color:var(--muted); margin:0 0 6px;}
  .fieldrow{display:flex; gap:10px;} .fieldrow > div{flex:1;}
  .opt{display:block; width:100%; text-align:left; padding:14px; border-radius:14px;
    border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px;
    font-weight:600; margin:0 0 10px; cursor:pointer; font-family:inherit;}
  .opt.correct{background:rgba(34,197,94,.14); border-color:var(--good);}
  .opt.wrong{background:rgba(239,68,68,.14); border-color:var(--bad);}
  .opt.chosen{border-color:var(--accent);}
  .explain{background:var(--card2); border-left:3px solid var(--accent); padding:10px 12px;
    border-radius:8px; font-size:14px; color:#cfe0f5; margin:0 0 12px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px;}
  .kpi .v{font-size:20px; font-weight:800;} .kpi .k{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .good{color:var(--good);} .bad{color:var(--bad);} .accent{color:var(--accent);}
  .lessonbody p{font-size:18px; line-height:1.62;}
  .example{background:rgba(10,109,245,.09); border:1px solid rgba(10,109,245,.35);
    border-radius:14px; padding:14px; margin:6px 0 14px;}
  .example b{color:var(--accent); font-size:12px; letter-spacing:.5px;}
  .disc{background:#1c2410; border:1px solid #4d5a1e; border-radius:14px; padding:14px;
    font-size:14px; color:#e4ecc8;}
  .banner{position:fixed; left:50%; transform:translateX(-50%); bottom:82px; z-index:60;
    background:#233046; border:1px solid var(--line); color:var(--text); padding:12px 16px;
    border-radius:12px; font-size:14px; max-width:90%; box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .chip{display:inline-block; padding:6px 10px; border-radius:999px; background:var(--card2);
    border:1px solid var(--line); font-size:13px; color:var(--muted); margin:0 6px 6px 0;}
  .center{text-align:center;}
  .lock{opacity:.65;}
  svg.spark{width:100%; height:auto; display:block; margin:6px 0;}
  hr{border:0; border-top:1px solid var(--line); margin:16px 0;}
  .tabbar-spacer{height:8px;}
  .onboard{padding:28px 20px 40px; min-height:100vh; display:flex; flex-direction:column;}
  .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--accent),#00337a);
    display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;}
  .toast-up{animation:up .25s ease;}
  @keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ---- lessons: illustrations + sticky quiz action ---- */
  .illus{margin:0 0 16px; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#0b0f15;}
  .illus svg{width:100%; height:auto; display:block;}
  .chart{width:100%; height:auto; display:block; border-radius:14px; border:1px solid var(--line);}
  .tag{font-size:12px; font-weight:800; color:var(--accent); border:1px solid var(--line);
    border-radius:8px; padding:2px 7px; vertical-align:middle;}
  .chartkey{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0 0;
    font-size:11.5px; color:var(--muted);}
  .chartkey .k{width:12px; height:3px; border-radius:2px; display:inline-block;}
  .chartkey .k.up{background:#0a6df5;} .chartkey .k.dn{background:#6b7787;}
  .chartkey .k.lv{background:#0a6df5; height:0; border-top:2px dashed #0a6df5;}
  .chartkey .k.sl{background:#93a4c3; height:0; border-top:2px dashed #93a4c3;}
  .chartkey{margin-bottom:2px;}
  .chartctl{display:flex; align-items:center; justify-content:space-between; margin:12px 0 2px;}
  .tfbar{display:flex; gap:6px;}
  .tfb{background:var(--card2); border:1px solid var(--line); color:var(--muted); border-radius:9px;
    padding:6px 11px; font-weight:800; font-size:12px; cursor:pointer; font-family:inherit;}
  .tfb.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .zoombar{display:flex; gap:6px;}
  .zbtn{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:9px;
    width:36px; height:33px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;}
  .bigbox{touch-action:none; cursor:crosshair; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  .chartreadout{font-size:12px; margin-bottom:6px; color:#cfe0f5; font-variant-numeric:tabular-nums; letter-spacing:.2px;}
  svg.chart.big{border-radius:0; border:0;}
  .btn.sticky{position:sticky; bottom:80px; z-index:6; box-shadow:0 12px 26px rgba(0,0,0,.55);}
  .credchip{display:inline-flex; align-items:center; gap:6px; background:var(--card2);
    border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-weight:800;
    color:var(--accent); font-size:13px;}
  .pro-card{background:linear-gradient(160deg, rgba(10,109,245,.20), rgba(10,109,245,.03));
    border:1px solid rgba(10,109,245,.55); border-radius:var(--radius); padding:16px;}
  .tick{display:flex; gap:10px; align-items:flex-start; margin:0 0 10px;}
  .tick span{color:var(--accent); font-weight:800;}
  .policy{padding-bottom:44px;}
  .policy-hero{padding:26px 4px 14px; border-bottom:1px solid var(--line); margin-bottom:20px;}
  .policy-hero .eyebrow{color:var(--accent); font-size:12px; font-weight:800;
    letter-spacing:.13em; text-transform:uppercase;}
  .policy-hero h1{font-family:Georgia,'Times New Roman',serif; font-size:36px; line-height:1.08;
    letter-spacing:-.02em; margin:8px 0 10px;}
  .policy h2{font-size:18px; margin:24px 0 8px;}
  .policy p,.policy li{color:#c9d2df; font-size:15px; line-height:1.65;}
  .policy ul{padding-left:21px; margin:8px 0 14px;}
  .policy li{margin-bottom:6px;}
  .policy-note{background:linear-gradient(135deg,rgba(10,109,245,.16),rgba(10,109,245,.04));
    border:1px solid rgba(10,109,245,.42); border-radius:14px; padding:14px; margin:16px 0;}

  /* ---- celebration ---- */
  .celebrate{text-align:center; padding:6px 0 2px;}
  .celebrate .badge{width:96px; height:96px; border-radius:50%; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center; font-size:46px;
    background:linear-gradient(135deg,var(--accent),#00337a);
    box-shadow:0 16px 38px rgba(10,109,245,.45); animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(.55); opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1); opacity:1}}
  .congrats{font-family:Georgia,'Times New Roman',serif; font-weight:700; letter-spacing:.02em;}

  /* ---- tour ---- */
  .dots{display:flex; gap:7px; justify-content:center; margin:14px 0;}
  .dots .dot{width:8px; height:8px; border-radius:50%; background:var(--line);}
  .dots .dot.on{background:var(--accent); width:22px; border-radius:999px;}

  /* ---- brand logo ---- */
  .applogo{width:104px; height:104px; margin:0 auto 12px; display:block;}
  .applogo img{width:100%; height:100%; display:block;
    filter:drop-shadow(0 12px 26px rgba(10,109,245,.35));}
  .brandname{font-family:Georgia,'Times New Roman',serif; font-weight:700;
    letter-spacing:.16em; font-size:30px; margin:0; color:#fff;}
  .brandtag{color:var(--accent); font-size:13px; font-weight:700; margin:6px 0 0;
    letter-spacing:.03em; font-family:Georgia,'Times New Roman',serif; font-style:italic;}
  .brandmark{width:34px; height:34px; flex:0 0 auto; display:inline-block;}
  .brandmark img{width:100%; height:100%; display:block;}

  /* ---- auth ---- */
  .authnote{background:var(--card2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; font-size:12.5px; color:var(--muted);}
  .err{background:rgba(239,68,68,.12); border:1px solid var(--bad); color:#ffc9c9;
    border-radius:12px; padding:10px 12px; font-size:13.5px; margin:0 0 12px;}
  .infobox{background:rgba(10,109,245,.14); border:1px solid var(--accent); color:#bcd8ff;
    border-radius:12px; padding:10px 12px; font-size:13.5px; margin:0 0 12px;}
  .link{color:var(--accent); font-weight:700; cursor:pointer;}

  /* ---- assistant ---- */
  #chatWrap{position:fixed; bottom:88px; right:max(14px, calc(50% - 226px));
    width:54px; height:54px; z-index:55;}
  #chatFab{width:54px; height:54px; border-radius:50%; border:1px solid var(--line);
    background:linear-gradient(135deg,var(--accent),#00337a); color:#fff; font-size:21px;
    cursor:pointer; box-shadow:0 10px 26px rgba(10,109,245,.5);}
  #chatFab:active{transform:scale(.94);}
  #chatPanel{position:absolute; bottom:66px; right:0; width:min(334px, 88vw);
    height:min(470px, 62vh); background:var(--card); border:1px solid var(--line);
    border-radius:20px; display:none; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 55px rgba(0,0,0,.66);}
  #chatWrap.open #chatPanel{display:flex;}
  .chatHead{display:flex; align-items:center; gap:9px; padding:11px 12px;
    border-bottom:1px solid var(--line); background:var(--card2);}
  .chatHead b{font-size:14px;}
  .chatx{margin-left:auto; background:none; border:0; color:var(--muted); font-size:15px; cursor:pointer;}
  .chatMsgs{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px;}
  .msg{max-width:88%; padding:10px 12px; border-radius:14px; font-size:14px; line-height:1.46;}
  .msg.bot{background:var(--card2); border:1px solid var(--line); align-self:flex-start; color:#dfe6f2;}
  .msg.me{background:var(--accent); color:#fff; align-self:flex-end;}
  .chatlink{display:block; width:100%; margin-top:8px; padding:8px 10px; border-radius:10px;
    border:1px solid var(--line); background:#000; color:var(--accent); font-size:12.5px;
    font-weight:700; cursor:pointer; text-align:left; font-family:inherit;}
  .chatChips{display:flex; gap:6px; overflow-x:auto; padding:8px 10px; border-top:1px solid var(--line);}
  .chatChip{white-space:nowrap; cursor:pointer;}
  .chatInput{display:flex; gap:8px; padding:10px; border-top:1px solid var(--line);}
  .chatInput input{margin:0; flex:1; padding:10px 12px; font-size:15px;}
  .chatSend{padding:0 15px; border-radius:12px; border:0; background:var(--accent); color:#fff;
    font-size:16px; cursor:pointer;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

  <div id="shell"></div>

{id:"basics",name:"Market Basics",icon:"🧭",tag:"What are you even trading?",lessons:[
 {id:"b1",title:"What are you trading?",pages:[
  "Fiat currency: government money like the US dollar (USD) or the euro (EUR). It is not backed by gold. Its value comes from trust and from the government that issues it. Currencies are always traded in pairs.",
  "Crypto: digital assets like Bitcoin or Ethereum. Very volatile, and it trades 24 hours a day, every day. There is no company behind it in the usual sense.",
  "Company stock: one share of a single business. ETF: a basket that holds many stocks or assets inside it. Commodity: a physical good like gold, oil, or wheat that is bought and sold in the market."],
  example:"Gold is a commodity. SPY is an ETF. BTC is crypto. EUR/USD is fiat currency traded as a pair.",
  quiz:[
   {q:"SPY is a...",o:["Single stock","ETF","Commodity","Stablecoin"],a:1,e:"SPY is an ETF that holds a broad basket of large US companies."},
   {q:"Bitcoin is...",o:["Fiat currency","A stock","Crypto","A bond"],a:2,e:"Bitcoin is a cryptocurrency and trades 24/7."},
   {q:"EUR/USD is...",o:["A fiat currency pair","A stock ticker","An ETF","A commodity"],a:0,e:"EUR/USD compares two fiat currencies."},
   {q:"A commodity is...",o:["A digital coin","A physical good like gold or oil","A bank loan","A currency"],a:1,e:"Commodities are physical goods traded in markets."}
  ]},
 {id:"b2",title:"What candlesticks are",pages:[
  "A candlestick shows four prices for one slice of time: the open, the high, the low and the close. The thick part is the body and it stretches from the open to the close. The thin lines above and below are the wicks, also called shadows.",
  "When the close is above the open, buyers were in control, so we draw the candle blue. When the close is below the open, sellers were in control, so the candle is hollow and grey. The longer the body, the stronger that side was.",
  "Each candle covers one timeframe. On a 1 day chart, each candle is one whole day. Switch to 1 hour and each candle is one hour. It is the same market, just a different zoom.",
  "The wicks tell the story of rejection. A long wick on top means price was pushed up and then sold back down. A long wick on the bottom means price was pushed down and then bought back up."],
  example:"A candle opens at 98, closes at 104, and its wick reaches 106 high and 97 low. Buyers won the session, but only after a dip.",
  quiz:[
   {q:"What four prices does a candle show?",o:["Open, high, low, close","Buy, sell, hold, wait","Fee, spread, tax, profit","Only the close"],a:0,e:"Every candle packs open, high, low and close into one shape."},
   {q:"The thick part of a candle is called the...",o:["Wick","Body","Shadow","Tail"],a:1,e:"The body runs from the open to the close."},
   {q:"The thin lines above and below the body are the...",o:["Bodies","Wicks","Gaps","Fees"],a:1,e:"Wicks, also called shadows, mark the high and the low."},
   {q:"A candle closes above its open. Who was in control?",o:["Sellers","Buyers","Nobody","The broker"],a:1,e:"Close above open means buyers won that period."}
  ]},
 {id:"b3",title:"Candlestick shapes that matter",pages:[
  "A doji has an almost invisible body because the open and close are nearly the same. It means indecision: neither side won that period.",
  "A hammer has a small body and one long wick below. Buyers pushed the price back up, so it often appears at the bottom of a fall. A shooting star is the mirror image: a long wick above, showing sellers rejected higher prices.",
  "An engulfing candle is a large candle that completely covers the previous small one. A bullish engulfing after a fall hints buyers are taking over. A bearish engulfing after a rise hints sellers are.",
  "A marubozu has almost no wicks at all, just a long body. It shows one side controlled the whole period with no hesitation."],
  example:"After a long fall, a hammer with a long lower wick forms right at support. It is a clue that buyers are stepping in, not a guarantee.",
  quiz:[
   {q:"A candle with an almost invisible body is a...",o:["Marubozu","Doji","Hammer","Shooting star"],a:1,e:"A doji shows indecision because open and close are nearly equal."},
   {q:"A long wick below a small body is a...",o:["Shooting star","Hammer","Doji","Engulfing"],a:1,e:"A hammer has a long lower wick and a small body."},
   {q:"A bullish engulfing candle...",o:["Is tiny","Completely covers the previous candle","Has no wicks","Is always grey"],a:1,e:"It engulfs the previous body, showing a shift in control."},
   {q:"A long wick above the body suggests...",o:["Buyers rejected lower prices","Sellers rejected higher prices","Nothing happened","The broker made an error"],a:1,e:"A long upper wick shows higher prices were sold back down."}
  ]},
 {id:"b4",title:"What a broker is",pages:[
  "A broker is the company that passes your order to the market. You do not buy a share directly from an exchange. Your broker sends the order for you and holds your account.",
  "Brokers earn money in a few ways. A commission is a fee per trade. A spread is the small gap between the buy price and the sell price. Some brokers also charge a fee for holding a position overnight.",
  "There are two common styles. A market maker broker quotes you a price and takes the other side of your trade. An ECN style broker connects you to other traders and the market, usually for a commission. Either can be good or bad.",
  "What matters most is cost, execution and regulation. A regulated broker must keep client money separate from company money and follow rules. Always check who regulates a broker, and whether it is allowed to serve you."],
  example:"You tap buy 10 shares. Your broker routes the order, fills you at the market price and takes a small spread or commission. The shares sit in your account.",
  quiz:[
   {q:"What does a broker do?",o:["Prints money","Passes your orders to the market and holds your account","Sets the market price","Guarantees profits"],a:1,e:"A broker is the middle layer between you and the market."},
   {q:"A spread is...",o:["A fee for opening an account","The gap between the buy and sell price","A tax","A type of candle"],a:1,e:"The spread is the difference between the buy and sell price."},
   {q:"A market maker broker...",o:["Quotes a price and takes the other side of your trade","Only takes commissions","Never makes money","Is always illegal"],a:0,e:"Market makers quote prices and take the opposite side."},
   {q:"The most important thing to check about a broker is...",o:["Its logo","That it is properly regulated","Its app colours","How many adverts it runs"],a:1,e:"Regulation protects your money and sets the rules."}
  ]}
]},
{id:"investing",name:"Investing",icon:"📈",tag:"Grow money slowly and safely.",lessons:[
 {id:"inv1",title:"Investing vs trading",pages:[
  "Investing means owning assets for years. You are betting that good companies and broad markets grow over a long time.",
  "Trading means buying and selling over days, hours, or minutes. You are betting on short-term price movement, not on long-term growth.",
  "Both can lose money. Investing is generally slower and steadier. Trading is faster and much riskier. Neither is guaranteed."],
  example:"Buying an S&P 500 fund and holding it for 10 years is investing. Buying a stock on Monday to sell on Friday is trading.",
  quiz:[
   {q:"Which usually means holding for years?",o:["Trading","Investing","Both equally","Neither"],a:1,e:"Investing is a long-term approach, usually measured in years."},
   {q:"Someone buying and selling within a week is...",o:["Investing","Trading","Diversifying","Bond buying"],a:1,e:"Short holding periods point to trading, not investing."},
   {q:"Investing focuses mainly on...",o:["Short-term price swings","Long-term growth","Daily fees","Leverage"],a:1,e:"Investors care about the long-term growth of what they own."},
   {q:"Can investors lose money?",o:["No, never","Only if they use leverage","Yes, markets can fall","Only in crypto"],a:2,e:"Markets can fall. Investing reduces some risk but never removes it."}
  ]},
 {id:"inv2",title:"Stocks vs ETFs vs index funds",pages:[
  "A stock is one share of one company. If that company struggles, your money suffers. A single stock is a concentrated bet.",
  "An ETF (exchange-traded fund) is a basket of many investments that trades like a stock. One ETF can hold hundreds of companies.",
  "An index fund tracks a market index, like the S&P 500. It is a low-cost, diversified way to own a whole market at once."],
  example:"AAPL is one company. SPY is an ETF that holds roughly 500 large US companies.",
  quiz:[
   {q:"A single share of Apple is a...",o:["Stock","ETF","Index fund","Bond"],a:0,e:"A stock is one share of one company."},
   {q:"Which holds many companies in one investment?",o:["A single stock","An ETF","A savings account","A stablecoin"],a:1,e:"ETFs bundle many holdings together."},
   {q:"Which is usually the most diversified?",o:["One stock","Three stocks","An index fund","One crypto coin"],a:2,e:"An index fund spreads money across a whole market."},
   {q:"Index funds are known for...",o:["High fees","Low fees","Guaranteed profits","Being a single company"],a:1,e:"Most index funds charge very low fees."}
  ]},
 {id:"inv3",title:"Diversification and fees",pages:[
  "Diversification means owning many different things so one bad investment does not ruin you. If one company fails, the rest of your money is not wiped out.",
  "Fees are the costs you pay to own a fund. Small annual fees add up to a surprising amount over decades.",
  "A fund charging 1% a year can cost far more over 30 years than one charging 0.05%. Even a small difference compounds against you."],
  example:"$10,000 growing 7% a year for 30 years becomes about $76,000. A 1% yearly fee can quietly cut tens of thousands off that.",
  quiz:[
   {q:"Diversification means...",o:["Putting all money in one stock","Spreading money across many investments","Day trading","Using leverage"],a:1,e:"Diversification spreads risk across many holdings."},
   {q:"Why do fees matter so much?",o:["They are illegal","They reduce your returns over time","They increase taxes","They lock your money"],a:1,e:"Every dollar of fees is a dollar that does not compound for you."},
   {q:"Which fee is usually better for a long-term investor?",o:["1.0%","0.8%","0.05%","2.0%"],a:2,e:"Lower fees leave more of the return in your account."},
   {q:"Owning just one stock is...",o:["Very diversified","Not diversified","Risk-free","An index fund"],a:1,e:"One stock is a concentrated position, not diversification."}
  ]},
 {id:"inv4",title:"Dividends and bonds (simple)",pages:[
  "Some companies pay dividends: a small cash payment to shareholders, often every three months. It is a share of profits returned to owners.",
  "Bonds are loans you make to a government or a company. They usually pay interest and swing less wildly in price than stocks.",
  "Adding bonds can make a portfolio steadier, but bonds usually grow more slowly than stocks over long periods."],
  example:"A $1,000 bond paying 4% per year gives about $40 a year in interest.",
  quiz:[
   {q:"A dividend is...",o:["A fee you pay","A cash payment to shareholders","A type of bond","A stock split"],a:1,e:"Dividends are profit paid out to shareholders, often quarterly."},
   {q:"A bond is...",o:["A loan to a government or company","A single stock","A crypto coin","A type of ETF fee"],a:0,e:"Buying a bond means lending money in exchange for interest."},
   {q:"Bonds are usually...",o:["More volatile than stocks","Less volatile than stocks","Exactly as volatile","Illegal to trade"],a:1,e:"Bonds typically move less than stocks."},
   {q:"Over long periods, bonds typically grow...",o:["Faster than stocks","Slower than stocks","Identical to stocks","Never"],a:1,e:"Bonds usually grow more slowly than stocks."}
  ]},
 {id:"inv5",title:"Time in the market vs checking every hour",pages:[
  "Markets go up and down every day. Watching every tick often leads to stressed, emotional decisions like selling at the worst moment.",
  "Historically, broad markets have risen over long periods, but past results never guarantee the future. This is why long time horizons matter.",
  "For most long-term investors, time in the market beats trying to time the market."],
  example:"Someone who panicked and sold during a crash often missed the recovery that followed.",
  quiz:[
   {q:"Checking prices every hour often leads to...",o:["Emotional decisions","Guaranteed profits","Lower fees","Zero risk"],a:0,e:"Constant checking makes it easy to act on emotion."},
   {q:"\"Time in the market\" means...",o:["Day trading","Staying invested for the long term","Checking hourly","Trading on news"],a:1,e:"It means staying invested rather than jumping in and out."},
   {q:"Trying to buy the exact bottom and sell the exact top is...",o:["Easy for experts","Very hard and unreliable","Guaranteed","Illegal"],a:1,e:"Consistently timing exact tops and bottoms is not realistic."},
   {q:"A long-term investor should expect...",o:["Only gains","No losses ever","Ups and downs along the way","Zero volatility"],a:2,e:"Even good long-term investments have rough periods."}
  ]},
 {id:"inv6",title:"Build a 3-fund portfolio idea",pages:[
  "A common simple idea is a three-fund portfolio: US stocks, international stocks, and bonds.",
  "One example split is 50% US stock index, 30% international stock index, and 20% bonds. The exact mix depends on your goals and how much ups and downs you can handle.",
  "Younger investors often hold more stocks. People closer to retirement often hold more bonds. This is general education, not advice for you."],
  example:"$1,000 split 50/30/20 = $500 US stocks, $300 international stocks, $200 bonds.",
  quiz:[
   {q:"A 3-fund portfolio usually includes...",o:["US stocks, international stocks, bonds","Only crypto","Three single stocks","Only bonds"],a:0,e:"The classic three-fund mix is US stocks, international stocks, and bonds."},
   {q:"Holding more bonds usually means...",o:["More volatility","Less volatility","Guaranteed profits","Higher risk"],a:1,e:"Bonds tend to make a portfolio steadier."},
   {q:"Your mix should depend on...",o:["Social media trends","Your goals and time horizon","The weather","A coin flip"],a:1,e:"Allocation should match your goals and how long you can invest."},
   {q:"This lesson is...",o:["Financial advice","Education only","A stock tip","A guarantee"],a:1,e:"Nothing here is financial advice."}
  ]}
]},
{id:"swing",name:"Swing Trading",icon:"📊",tag:"Hold days to weeks. Catch a move.",lessons:[
 {id:"sw1",title:"What swing trading is",pages:[
  "Swing trading means holding a trade for days to weeks to catch a price move. You are not holding for years like an investor.",
  "Swing traders study daily charts and look for trends or patterns, then plan an entry, a stop, and a target before they trade.",
  "It is normal for swing traders to lose on many trades. The goal is to lose small and win bigger."],
  example:"Buy a stock on Tuesday, hold through the week, and sell the following Tuesday after a 6% move.",
  quiz:[
   {q:"Swing trades are usually held...",o:["Minutes","Days to weeks","Years","Only overnight"],a:1,e:"Swing trading holds for days up to a few weeks."},
   {q:"Swing trading is the same as investing?",o:["Yes, identical","No, different time horizon","Only in crypto","Only on weekends"],a:1,e:"Swing trading is short-to-medium term, not long-term investing."},
   {q:"Swing traders accept that...",o:["They never lose","Many trades will be small losses","Every trade wins","Stops are optional"],a:1,e:"Small losses are a normal part of the process."},
   {q:"Swing traders mainly read...",o:["1-minute charts","Daily charts","Tick charts only","Charts never"],a:1,e:"Daily charts are the core tool for swing traders."}
  ]},
 {id:"sw2",title:"Daily charts and trends",pages:[
  "A daily chart shows one bar or candle per day. An uptrend makes higher highs and higher lows. A downtrend makes lower highs and lower lows.",
  "Trading with the trend is generally easier than fighting it. Trend-following setups put the odds on your side more often.",
  "The 20-day moving average is a common guide. It smooths price and helps you see the recent trend direction."],
  example:"A stock bouncing off its rising 20-day average is a classic swing setup.",
  quiz:[
   {q:"An uptrend shows...",o:["Lower highs and lower lows","Higher highs and higher lows","No pattern","Only flat price"],a:1,e:"Uptrends climb with higher highs and higher lows."},
   {q:"A downtrend shows...",o:["Higher highs","Lower highs and lower lows","Higher lows","Sideways price"],a:1,e:"Downtrends step down with lower highs and lower lows."},
   {q:"The 20-day average is used as...",o:["A stop loss","A trend guide","A news feed","A fee"],a:1,e:"Moving averages help show the trend direction."},
   {q:"Trading against the trend is usually...",o:["Easier","Harder","Free of risk","Illegal"],a:1,e:"Fighting the trend usually makes trading harder."}
  ]},
 {id:"sw3",title:"The 1% risk rule",pages:[
  "A common rule is to never risk more than 1% of your account on a single trade. On a $1,000 account, that is $10.",
  "\"Risk\" does not mean the total size of the trade. It means the money you would lose if your stop loss is hit.",
  "By risking 1%, a losing streak stings but does not wipe you out. Protection of capital comes first."],
  example:"$1,000 x 1% = $10 maximum risk on one trade.",
  quiz:[
   {q:"On a $1,000 account, 1% risk is...",o:["$1","$10","$100","$1,000"],a:1,e:"1% of $1,000 is $10."},
   {q:"In the 1% rule, \"risk\" means...",o:["Total trade size","The loss if your stop is hit","The fee","Your account balance"],a:1,e:"Risk is what you lose at your stop, not the whole position size."},
   {q:"The 1% rule helps you...",o:["Get rich fast","Survive losing streaks","Avoid taxes","Predict prices"],a:1,e:"Small risk per trade keeps you in the game."},
   {q:"If you risk 1% and lose 5 in a row, you lose about...",o:["1%","5%","50%","100%"],a:1,e:"Five losses of 1% each total roughly 5%."}
  ]},
 {id:"sw4",title:"Stop loss and take profit",pages:[
  "A stop loss is an exit order that closes your trade if price goes against you. It caps how much you can lose.",
  "A take profit is a target price where you close the trade and lock in gains.",
  "Both should be set before you enter, based on the chart. Moving a stop farther away mid-trade because you are scared is a common and costly mistake."],
  example:"Buy at $100, stop at $96, target at $110. You risk $4 to potentially make $10.",
  quiz:[
   {q:"A stop loss is...",o:["A target for profit","An exit if the trade goes against you","A type of fee","A dividend"],a:1,e:"A stop loss limits how much a bad trade can cost you."},
   {q:"A take profit is...",o:["A target to lock in gains","A fee","A stop loss","A leverage tool"],a:0,e:"A take profit closes the trade at your target."},
   {q:"Stops should be set...",o:["After the trade closes","Before you enter","Only on losers","Never"],a:1,e:"Deciding your stop before entry keeps emotion out."},
   {q:"Moving your stop farther away when scared is...",o:["Recommended","A common and costly mistake","Illegal","A tax strategy"],a:1,e:"Widening a stop turns small losses into big ones."}
  ]},
 {id:"sw5",title:"Risk-to-reward (need at least 2:1)",pages:[
  "Risk-to-reward compares how much you can lose to how much you can gain on a trade.",
  "Aiming for at least 2:1 means that if you risk $10, your target is a $20 gain.",
  "With 2:1, you can be right less than half the time and still do okay over many trades. It is about the math, not winning every time."],
  example:"Risk $10 to make $20. That is a 2:1 trade.",
  quiz:[
   {q:"2:1 risk-to-reward means...",o:["Risking 2 to make 1","Risking 1 to make 2","Equal risk and reward","No risk"],a:1,e:"You aim to make twice what you risk."},
   {q:"With 2:1, you can be right...",o:["Every time","Less than half the time and still do okay","Never","Only on Mondays"],a:1,e:"Good reward per win can offset a lower win rate."},
   {q:"Risking $10 with a 2:1 target means a goal of...",o:["$5","$10","$20","$100"],a:2,e:"2:1 means target twice the risk, so $20."},
   {q:"Poor risk-to-reward tends to mean...",o:["Big wins, small losses","Small gains and big losses","No losses","Guaranteed profit"],a:1,e:"When you risk more than you target, losing trades hurt more."}
  ]},
 {id:"sw6",title:"The pullback setup",pages:[
  "In an uptrend, price often pulls back down to a moving average or a support level before continuing up.",
  "A pullback entry buys the dip within the trend. Your stop goes just below the support or moving average.",
  "If price breaks the trend instead of bouncing, the setup is invalid. Skip it and wait for the next one."],
  example:"A stock in an uptrend pulls back to its 20-day average and holds. A swing trader considers an entry there.",
  quiz:[
   {q:"A pullback buys...",o:["The top of a move","The dip within an uptrend","A downtrend only","A random price"],a:1,e:"Pullbacks buy temporary dips inside an uptrend."},
   {q:"In a pullback setup, the stop usually goes...",o:["Above the entry","Below support","At the target","Nowhere"],a:1,e:"The stop sits just below the support that should hold."},
   {q:"If the trend breaks, you should...",o:["Buy more","Skip the setup","Double your size","Remove the stop"],a:1,e:"A broken trend invalidates the pullback setup."},
   {q:"Pullback trades work best when...",o:["The trend is up","The trend is down","There is no trend","Volume is zero"],a:0,e:"Pullbacks rely on an existing uptrend continuing."}
  ]},
 {id:"sw7",title:"Breakout + first pullback",pages:[
  "A breakout happens when price pushes above a resistance level, ideally on strong volume.",
  "Chasing a breakout immediately can be risky because price often snaps back. Many traders wait for the first pullback after the breakout.",
  "The first pullback after a breakout can give a tighter stop and a better entry price."],
  example:"A stock breaks above $50 on high volume, pulls back to $50, then continues higher.",
  quiz:[
   {q:"A breakout is...",o:["Price falling below support","Price moving above resistance","A fee","A dividend"],a:1,e:"Breakouts push price above a resistance level."},
   {q:"A safer entry is often...",o:["Chasing immediately","The first pullback after the breakout","Selling the breakout","Ignoring volume"],a:1,e:"Waiting for the pullback can improve your entry."},
   {q:"A pullback after a breakout gives...",o:["A wider stop","A tighter stop","No stop","A bigger loss"],a:1,e:"Buying closer to support allows a tighter stop."},
   {q:"Chasing a breakout the instant it happens is...",o:["Risk-free","Risky","Always right","Guaranteed"],a:1,e:"Fast chasing often leads to buying the top of a spike."}
  ]},
 {id:"sw8",title:"When NOT to trade",pages:[
  "Avoid trading when you are tired, angry, or trying to win back losses. Emotion is the enemy of a good plan.",
  "Avoid big news events and earnings reports if you do not understand the risk. They can cause sudden, unpredictable moves.",
  "No setup means no trade. Sitting in cash is a valid position and often the smartest one."],
  example:"Skipping a trade after three losses in a row is a good decision, not a weakness.",
  quiz:[
   {q:"You should avoid trading when...",o:["You have a clear plan","You are tired, angry, or revenge trading","The market is open","You set a stop"],a:1,e:"Emotional states lead to bad decisions."},
   {q:"\"No setup, no trade\" means...",o:["You must trade daily","It is fine to do nothing","Always buy dips","Never use stops"],a:1,e:"Doing nothing is a legitimate choice."},
   {q:"Cash is...",o:["A bad position","A valid position","Illegal","Only for beginners"],a:1,e:"Holding cash to wait for a good setup is valid."},
   {q:"Big earnings and news can cause...",o:["Predictable moves","Unpredictable moves","No change","Guaranteed gains"],a:1,e:"News can trigger sudden, hard-to-predict price jumps."}
  ]},
 {id:"sw9",title:"Write a 1-line trade plan",pages:[
  "Before entering, write one line: symbol, direction, entry, stop, target, and the reason.",
  "A written plan removes emotion and makes your trades easy to review later.",
  "If you cannot write the plan in one line, you probably do not have a clear trade yet."],
  example:"\"AAPL long, entry 180, stop 176, target 190, pullback to the 20-day in an uptrend.\"",
  quiz:[
   {q:"A trade plan should include...",o:["Only the symbol","Entry, stop, target, and reason","Just the target","Nothing written"],a:1,e:"A complete plan covers entry, stop, target, and why."},
   {q:"A written plan helps you...",o:["Remove emotion","Guarantee profits","Avoid fees","Predict news"],a:0,e:"Writing it down keeps decisions rule-based."},
   {q:"If you cannot write one line...",o:["Trade anyway","You probably do not have a trade","Ask a friend","Double the size"],a:1,e:"If it is not clear enough to write, it is not a clear trade."},
   {q:"The plan is written...",o:["After the trade closes","Before entering","Only if it wins","Never"],a:1,e:"The plan comes before the entry."}
  ]}
]},
{id:"day",name:"Day Trading",icon:"⚡",tag:"Same-day trades. Very high risk.",lessons:[
 {id:"day1",title:"What day trading is",pages:[
  "Day trading means opening and closing a trade on the same day. Nothing is held overnight.",
  "It moves fast and demands focus, quick decisions, and very strict rules.",
  "It is extremely hard. Most beginners lose money. Treat this path as education, not a plan to get rich."],
  example:"Buy a stock at 10:00 AM and sell it at 2:00 PM the same day.",
  quiz:[
   {q:"Day trading means...",o:["Holding for months","Opening and closing the same day","Only investing","Buying bonds"],a:1,e:"Day trades are closed before the session ends."},
   {q:"Day trading is...",o:["Easy","Extremely hard","Risk-free","Guaranteed"],a:1,e:"Day trading is very difficult and most beginners lose."},
   {q:"Most beginners in day trading...",o:["Get rich","Lose money","Break even forever","Never trade"],a:1,e:"The majority of beginners lose money."},
   {q:"Day trading requires...",o:["Loose rules","Strict rules and focus","No plan","Holding overnight"],a:1,e:"Discipline and speed are essential."}
  ]},
 {id:"day2",title:"Why most beginners lose (risk quiz)",pages:[
  "Beginners often risk too much on one trade, trade too often, and ignore their stop losses.",
  "Fees and spreads quietly eat small accounts. Lots of small costs add up fast.",
  "Without a written plan, emotions take over and decisions get worse as losses pile up."],
  example:"Risking 20% on one trade means two bad trades can destroy most of an account.",
  quiz:[
   {q:"A common beginner mistake is...",o:["Using a plan","Risking too much","Setting stops","Small size"],a:1,e:"Oversizing is one of the biggest beginner errors."},
   {q:"Overtrading means...",o:["Trading too rarely","Trading too often","Holding too long","Using stops"],a:1,e:"Overtrading is taking too many low-quality trades."},
   {q:"Ignoring your stop loss...",o:["Is fine","Can turn small losses into big ones","Increases profits","Lowers fees"],a:1,e:"Skipping stops lets losers grow out of control."},
   {q:"To reduce losses, beginners should...",o:["Risk more","Use a plan and small risk","Remove stops","Trade bigger"],a:1,e:"A plan plus small, controlled risk is the safer path."}
  ]},
 {id:"day3",title:"Intraday charts",pages:[
  "Intraday charts show minutes or hours, like 5-minute bars. They zoom into the very short term.",
  "They are noisier than daily charts and easier to misread. Small moves can look like big trends.",
  "Many traders still align their intraday trades with the daily trend to improve their odds."],
  example:"A 5-minute chart might show a spike that looks huge but is tiny on the daily chart.",
  quiz:[
   {q:"Intraday charts show...",o:["Years","Minutes or hours","Only monthly data","Dividends"],a:1,e:"Intraday charts cover short time frames."},
   {q:"Compared to daily charts, intraday charts are...",o:["Calmer","Noisier","Identical","Always clearer"],a:1,e:"Short time frames produce more noise."},
   {q:"Aligning with the daily trend can...",o:["Improve odds","Guarantee wins","Remove risk","Lower fees"],a:0,e:"Trading with the bigger trend can help."},
   {q:"A 5-minute bar represents...",o:["A week","Five minutes of price action","A month","One tick"],a:1,e:"Each bar covers five minutes."}
  ]},
 {id:"day4",title:"The same-day exit rule",pages:[
  "A core day-trading rule: close all trades before the market closes. Nothing is held overnight.",
  "Overnight news can gap the price far beyond your stop, so you can lose more than planned.",
  "The same-day rule exists to remove that surprise overnight risk."],
  example:"A stock closes at $50, then bad news drops it to $45 by morning. An overnight holder loses far more than planned.",
  quiz:[
   {q:"Day traders usually close trades...",o:["Before the close","Next week","After a month","Never"],a:0,e:"Day trades are closed before the session ends."},
   {q:"Overnight news can cause...",o:["No change","Gaps beyond your stop","Smaller losses only","Guaranteed gains"],a:1,e:"Gaps can jump past your stop, increasing losses."},
   {q:"The same-day rule limits...",o:["Fees","Surprise overnight risk","Profits only","Accuracy"],a:1,e:"It exists to control overnight gap risk."},
   {q:"Holding overnight turns a trade into...",o:["A bond","A swing trade with different risk","An index fund","A dividend"],a:1,e:"Holding overnight adds overnight risk, like a swing trade."}
  ]},
 {id:"day5",title:"Overtrading",pages:[
  "More trades do not mean more profit. They often mean more fees and more mistakes.",
  "Good traders wait for a few clear setups instead of forcing trades all day.",
  "Track your trades and cut the setups that lose money. Your journal is a coach."],
  example:"A trader taking 2 good setups a week may beat one taking 20 forced trades.",
  quiz:[
   {q:"Overtrading usually leads to...",o:["More fees and mistakes","Guaranteed profit","Lower risk","Better focus"],a:0,e:"Extra trades add costs and errors."},
   {q:"Good traders...",o:["Trade constantly","Wait for clear setups","Ignore plans","Never use stops"],a:1,e:"Patience beats activity."},
   {q:"Tracking trades helps you...",o:["Cut what does not work","Trade more randomly","Avoid journals","Ignore losses"],a:0,e:"Your journal shows which setups actually work."},
   {q:"Trading more often automatically means...",o:["More profit","Nothing good","Less risk","Lower fees"],a:1,e:"Frequency alone guarantees nothing."}
  ]}
]},
{id:"forex",name:"Currencies & Forex",icon:"💱",tag:"Trade currency pairs. Mind the leverage.",lessons:[
 {id:"fx1",title:"What currency is (fiat)",pages:[
  "Fiat money is currency not backed by gold. Its value comes from trust and from the government that issues it.",
  "Every country issues its own money, and its value changes relative to other currencies every day.",
  "In forex, currencies are always traded in pairs, one against another."],
  example:"The US dollar is fiat money. Its value rises and falls against the euro, yen, and pound.",
  quiz:[
   {q:"Fiat money is backed by...",o:["Gold","Trust and government, not gold","Bitcoin","Silver"],a:1,e:"Modern fiat money is not backed by a physical commodity."},
   {q:"A currency's value...",o:["Never changes","Changes versus other currencies","Is fixed forever","Equals gold"],a:1,e:"Currency values float against each other."},
   {q:"Currencies are traded...",o:["Alone","In pairs","Only in crypto","Only on weekends"],a:1,e:"Forex always quotes currencies against each other."},
   {q:"A currency is...",o:["A country's money","A stock","A bond","A fund"],a:0,e:"A currency is a nation's money."}
  ]},
 {id:"fx2",title:"Major currencies: USD, EUR, JPY, GBP",pages:[
  "The major currencies are the US dollar (USD), the euro (EUR), the Japanese yen (JPY), and the British pound (GBP).",
  "The USD is the world's main reserve currency and appears in most forex trades.",
  "The majors are the most liquid and usually have the tightest spreads, which means lower trading costs."],
  example:"EUR/USD, USD/JPY, and GBP/USD are among the most heavily traded pairs in the world.",
  quiz:[
   {q:"Which is a major currency?",o:["USD","A stock ticker","An ETF","Gold"],a:0,e:"USD is one of the major currencies."},
   {q:"The world's main reserve currency is...",o:["EUR","USD","JPY","BTC"],a:1,e:"The US dollar is the primary reserve currency."},
   {q:"The majors are...",o:["The least liquid","The most liquid","Untradeable","Only for experts"],a:1,e:"Major pairs are the most liquid markets."},
   {q:"Tighter spreads mean...",o:["Higher costs","Lower trading costs","No costs","Illegal trades"],a:1,e:"Tighter spreads reduce cost per trade."}
  ]},
 {id:"fx3",title:"Currency pairs (EUR/USD means euro vs dollar)",pages:[
  "EUR/USD means euros versus dollars. The first currency is the base, the second is the quote.",
  "If EUR/USD rises, the euro got stronger against the dollar. If it falls, the euro got weaker.",
  "Each pair has its own personality, average range, and volatility."],
  example:"EUR/USD at 1.08 means one euro buys 1.08 US dollars.",
  quiz:[
   {q:"EUR/USD goes up. Which currency got stronger?",o:["Dollar","Euro","Both","Neither"],a:1,e:"When EUR/USD rises, the euro is strengthening."},
   {q:"In EUR/USD, the base currency is...",o:["EUR","USD","Both","Neither"],a:0,e:"The first currency listed is the base."},
   {q:"In EUR/USD, the quote currency is...",o:["EUR","USD","Both","Neither"],a:1,e:"The second currency listed is the quote."},
   {q:"EUR/USD at 1.08 means 1 euro buys...",o:["0.08 dollars","1.08 dollars","1.80 dollars","108 dollars"],a:1,e:"The quote shows how many dollars one euro buys."}
  ]},
 {id:"fx4",title:"What a pip is",pages:[
  "A pip is the smallest standard move in most currency pairs, usually 0.0001.",
  "For EUR/USD, a move from 1.0800 to 1.0801 is one pip.",
  "Pips help traders measure movement and calculate profit and loss."],
  example:"A 50-pip move on EUR/USD is 0.0050 in price.",
  quiz:[
   {q:"A pip is usually...",o:["0.1","0.01","0.0001","1.0"],a:2,e:"For most pairs a pip is 0.0001."},
   {q:"EUR/USD moving from 1.0800 to 1.0801 is...",o:["One pip","Ten pips","One dollar","Zero"],a:0,e:"That 0.0001 move is one pip."},
   {q:"Pips measure...",o:["Fees","Price movement","Interest","Dividends"],a:1,e:"Pips are a unit of currency price movement."},
   {q:"50 pips equals...",o:["0.0005","0.0050","0.0500","0.5000"],a:1,e:"50 pips x 0.0001 = 0.0050."}
  ]},
 {id:"fx5",title:"Why leverage is dangerous",pages:[
  "Leverage lets you control a big position with a small amount of money.",
  "It multiplies gains and losses equally. A small move against you can cost a lot.",
  "High leverage can wipe out an account in seconds. Beginners should treat it as dangerous, not as free money."],
  example:"With 100:1 leverage, a 1% adverse move can wipe out your entire deposit.",
  quiz:[

function $(id){ return document.getElementById(id); }

function dayIndex(){ return Math.floor(Date.now()/86400000); }
function hash(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ var s=seed>>>0; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function fmt(n,dec){ dec = dec==null?2:dec; return Number(n).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec}); }

/* Deterministic per-day practice price series (fake but consistent). */
/* Deterministic practice market data (fake, but consistent for the day).
   A long hourly history powers the interactive chart; higher timeframes aggregate it. */
var _histCache = {}, _aggCache = {};
var TF = {
  "1H": { group:1,   bars:90, ms:3600000 },
  "4H": { group:4,   bars:80, ms:4*3600000 },
  "1D": { group:24,  bars:60, ms:86400000 },
  "1W": { group:168, bars:26, ms:7*86400000 }
};
function history(sym){
  var hit = _histCache[sym];
  if(hit && hit.day===dayIndex()) return hit.d;
  var m = symMeta(sym); if(!m) return [{o:1,h:1,l:1,c:1,v:1,t:Date.now()}];
  var r = rng(hash(sym) + dayIndex()*131 + 7);
  var vol = m.market==="crypto"?0.010 : m.market==="forex"?0.0013 : 0.0042;
  var p = m.base * (0.90 + 0.20*r());
  var N = 1500, hourMs = 3600000, t0 = Date.now() - (N-1)*hourMs;
  var out = [];
  for(var i=0;i<N;i++){
    var o = p;
    var c = Math.max(0.0001, o*(1 + (r()-0.485)*vol));
    var body = Math.abs(c-o);
    var h = Math.max(o,c) + body*0.55 + o*vol*0.5*r();
    var l = Math.max(0.0001, Math.min(o,c) - body*0.55 - o*vol*0.5*r());
    out.push({o:o,h:h,l:l,c:c,v:0.4+r(),t:t0+i*hourMs});
    p = c;
  }
  _histCache[sym] = {day:dayIndex(), d:out};
  return out;
}
function aggFor(sym, tf){
  var key = sym+"|"+tf+"|"+dayIndex();
  if(_aggCache[key]) return _aggCache[key];
  var base = history(sym), g = (TF[tf]||TF["1D"]).group, out;
  if(g<=1){ out = base; }
  else {
    out = [];
    for(var i=0;i<base.length;i+=g){
      var chunk = base.slice(i, i+g); if(!chunk.length) break;
      var hi=chunk[0].h, lo=chunk[0].l, vv=0;
      for(var j=0;j<chunk.length;j++){ if(chunk[j].h>hi) hi=chunk[j].h; if(chunk[j].l<lo) lo=chunk[j].l; vv+=chunk[j].v; }
      out.push({ o:chunk[0].o, c:chunk[chunk.length-1].c, h:hi, l:lo, v:vv, t:chunk[0].t });
    }
  }
  _aggCache[key] = out;
  return out;
}
function candlesFor(sym){ return aggFor(sym,"1D").slice(-54); }
function series(sym){ return candlesFor(sym).map(function(k){ return k.c; }); }
/* The market moves during a session (a new tick every ~12 seconds), so open P&L
   and stop / target levels actually do something while the app is open. */
function tickIndex(){ return Math.floor(Date.now()/12000); }
function livePrice(sym){
  var h = history(sym); if(!h.length) return 1;
  var base = h[h.length-1].c;
  var m = symMeta(sym) || {market:"stock"};
  var vol = m.market==="crypto"?0.0030 : m.market==="forex"?0.0005 : 0.0014;
  var r = rng((hash(sym) + tickIndex()*7919 + 13)>>>0);
  var drift = (r()-0.5)*2*vol;
  var wave = Math.sin(tickIndex()/7 + (hash(sym)%100)) * vol * 0.6;
  return Math.max(0.0001, base*(1 + drift + wave));
}
function price(sym){ return livePrice(sym); }
function applyLive(sym, arr){
  if(!arr || !arr.length) return arr||[];
  var last = arr[arr.length-1], p = livePrice(sym);
  var copy = arr.slice(0, arr.length-1);
  copy.push({ o:last.o, c:p, h:Math.max(last.h,p), l:Math.min(last.l,p), v:last.v, t:last.t });
  return copy;
}
function timeLabel(t, tf){
  var d = new Date(t);
  if(tf==="1H" || tf==="4H") return d.getHours()+":00";
  return d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
}

/* Real candlestick chart with wicks, axes, live price and SL / TP levels. */
function candleChart(sym, opts){
  opts = opts || {};
  var cs = applyLive(sym, candlesFor(sym)), m = symMeta(sym), dec = m ? m.dec : 2;
  var compact = !!opts.compact;
  var W = opts.w || 340, H = opts.h || 210;
  var padL = 6, padR = compact ? 6 : 54, padT = 8, padB = compact ? 6 : 20;
  var iw = W-padL-padR, ih = H-padT-padB;
  var lo = Infinity, hi = -Infinity;
  cs.forEach(function(k){ if(k.l<lo) lo=k.l; if(k.h>hi) hi=k.h; });
  var levels = [];
  if(opts.entry)  levels.push({v:opts.entry,  kind:"entry",  label:"Entry"});
  if(opts.stop)   levels.push({v:opts.stop,   kind:"stop",   label:"Stop"});
  if(opts.target) levels.push({v:opts.target, kind:"target", label:"Target"});
  levels.forEach(function(L){ if(L.v<lo) lo=L.v; if(L.v>hi) hi=L.v; });
  var pad = (hi-lo)*0.10 || (hi*0.01) || 1; lo -= pad; hi += pad;
  function xOf(i){ return padL + (i+0.5)*(iw/cs.length); }
  function yOf(p){ return padT + (hi-p)/(hi-lo)*ih; }
  var cw = Math.max(2, (iw/cs.length)*0.62);
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#0b0f15"/>';
  for(var g=0; g<=4; g++){
    var gy = padT + g/4*ih;
    s += '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="#1b2431" stroke-width="1"/>';
    if(!compact) s += '<text x="'+(W-padR+6)+'" y="'+(gy+3.5).toFixed(1)+'" fill="#6d7f9e" font-size="10" font-family="sans-serif">'+fmt(hi-(hi-lo)*(g/4),dec)+'</text>';
  }
  cs.forEach(function(k,i){
    var x = xOf(i), up = k.c >= k.o, col = up ? "#0a6df5" : "#6b7787";
    s += '<line x1="'+x.toFixed(1)+'" y1="'+yOf(k.h).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+yOf(k.l).toFixed(1)+'" stroke="'+col+'" stroke-width="1.3"/>';
    var yo = yOf(k.o), yc = yOf(k.c), top = Math.min(yo,yc), hh = Math.max(1.8, Math.abs(yc-yo));
    s += '<rect x="'+(x-cw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="1" fill="'+(up?col:"#141b26")+'" stroke="'+col+'" stroke-width="1.1"/>';
  });
  var last = cs[cs.length-1].c, yLast = yOf(last);
  s += '<line x1="'+padL+'" y1="'+yLast.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yLast.toFixed(1)+'" stroke="#9fb3cc" stroke-width="1" stroke-dasharray="3 3"/>';
  if(!compact) s += '<rect x="'+(W-padR+1)+'" y="'+(yLast-8).toFixed(1)+'" width="'+(padR-2)+'" height="16" rx="4" fill="#0a6df5"/><text x="'+(W-padR+5)+'" y="'+(yLast+3.5).toFixed(1)+'" fill="#fff" font-size="10" font-weight="700" font-family="sans-serif">'+fmt(last,dec)+'</text>';
  var used = [yLast];
  levels.forEach(function(L){
    var y = yOf(L.v);
    var col = L.kind==="stop" ? "#93a4c3" : "#0a6df5";
    s += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="'+col+'" stroke-width="1.7" stroke-dasharray="'+(L.kind==="entry"?"0":"5 4")+'"/>';
    if(!compact){
      var ly = y; while(used.some(function(u){ return Math.abs(u-ly)<11; })) ly += 11;
      used.push(ly);
      s += '<text x="'+(W-padR+4)+'" y="'+(ly+3.5).toFixed(1)+'" fill="'+col+'" font-size="9.5" font-weight="700" font-family="sans-serif">'+L.label+'</text>';
    }
  });
  s += '</svg>';
  return s;
}

/* ---------- Interactive chart (pan / zoom, TradingView style) ---------- */
var BCH_W=360, BCH_H=430, BCH_PADL=8, BCH_PADR=58, BCH_PADT=10;
var BCH_PH=250, BCH_VTOP=BCH_PADT+BCH_PH+14, BCH_VH=54, BCH_TIMEY=BCH_VTOP+BCH_VH+18;
var BCH_PLOTW = BCH_W-BCH_PADL-BCH_PADR;
var big = { sym:"AAPL", tf:"1D", bars:60, offset:0, zoom:1, shift:0, cross:null };
function bigDec(){ var m=symMeta(big.sym); return m?m.dec:2; }

function drawBig(){
  var el=$("bigChart"); if(!el) return;
  var data = aggFor(big.sym, big.tf);
  var len = data.length, dec = bigDec();
  var bars = Math.max(10, Math.min(Math.round(big.bars), len));
  var off = Math.max(0, Math.min(Math.round(big.offset), len-bars));
  var end = len - off, start = Math.max(0, end-bars);
  var vis = applyLive(big.sym, data.slice(start, end));
  if(!vis.length) return;
  var lo=Infinity, hi=-Infinity, vmax=0.0001;
  vis.forEach(function(k){ if(k.l<lo) lo=k.l; if(k.h>hi) hi=k.h; if(k.v>vmax) vmax=k.v; });
  // keep any stop / target / entry levels of this symbol inside the visible range
  S.open.forEach(function(tr){
    if(tr.sym!==big.sym) return;
    [tr.entry, tr.stop, tr.target].forEach(function(v){ if(v){ if(v<lo) lo=v; if(v>hi) hi=v; } });
  });
  var span = ((hi-lo)*1.12/(big.zoom||1)) || (hi*0.01) || 1;
  var center = (lo+hi)/2 + (big.shift||0);
  var top = center + span/2;
  function X(i){ return BCH_PADL + (i+0.5)*(BCH_PLOTW/vis.length); }
  function Y(p){ return BCH_PADT + (top-p)/span*BCH_PH; }
  var cw = Math.max(1.6, (BCH_PLOTW/vis.length)*0.62);
  var s = '<svg class="chart big" viewBox="0 0 '+BCH_W+' '+BCH_H+'" xmlns="http://www.w3.org/2000/svg">';
  s += '<rect x="0" y="0" width="'+BCH_W+'" height="'+BCH_H+'" fill="#0b0f15"/>';
  for(var g=0; g<=5; g++){
    var gy = BCH_PADT + g/5*BCH_PH;
    s += '<line x1="'+BCH_PADL+'" y1="'+gy.toFixed(1)+'" x2="'+(BCH_W-BCH_PADR)+'" y2="'+gy.toFixed(1)+'" stroke="#1b2431"/>';
    s += '<text x="'+(BCH_W-BCH_PADR+5)+'" y="'+(gy+3.5).toFixed(1)+'" fill="#6d7f9e" font-size="10" font-family="sans-serif">'+fmt(top-g/5*span,dec)+'</text>';
  }
  var step = Math.max(1, Math.round(vis.length/4));
  for(var gi=0; gi<vis.length; gi+=step){

var bigPts = {}, bigDrag = null, bigPinch = null;
function mountBig(){
  var box = $("bigBox"); if(!box) return;
  bigPts = {}; bigDrag = null; bigPinch = null;
  drawBig();
  if(typeof box.addEventListener !== "function") return;
  function toSvg(e){
    var r = box.getBoundingClientRect();
    var k = BCH_W / (r.width||BCH_W);
    return { x:(e.clientX-r.left)*k, y:(e.clientY-r.top)*k };
  }
  function maxOff(){
    var len = aggFor(big.sym, big.tf).length;
    return Math.max(0, len - Math.round(big.bars));
  }
  box.addEventListener("pointerdown", function(e){
    try{ box.setPointerCapture(e.pointerId); }catch(err){}
    var p = toSvg(e); bigPts[e.pointerId] = p;
    var ids = Object.keys(bigPts);
    if(ids.length===1){
      bigDrag = { mode: p.x > BCH_W-BCH_PADR ? "price" : "pan", sx:p.x, sy:p.y, off:big.offset, shift:big.shift, zoom:big.zoom, bars:big.bars };
      big.cross = null;
    } else { bigPinch = null; }
  });
  box.addEventListener("pointermove", function(e){
    var p = toSvg(e);
    if(bigPts[e.pointerId]) bigPts[e.pointerId] = p;
    var ids = Object.keys(bigPts);
    if(ids.length>=2){
      var a = bigPts[ids[0]], b = bigPts[ids[1]];
      var dist = Math.sqrt(Math.pow(a.x-b.x,2)+Math.pow(a.y-b.y,2));
      if(bigPinch){ big.bars = Math.max(12, Math.min(220, Math.round(bigPinch.bars * (bigPinch.dist/Math.max(1,dist))))); }
      else { bigPinch = { dist:dist, bars:big.bars }; }
      big.cross = null; drawBig(); return;
    }
    if(bigDrag){
      if(bigDrag.mode==="pan"){
        var stepPx = BCH_PLOTW / Math.max(10, Math.round(big.bars));
        big.offset = Math.max(0, Math.min(maxOff(), bigDrag.off + (p.x-bigDrag.sx)/stepPx));
        big.shift = bigDrag.shift - (p.y-bigDrag.sy) * (bigSpan()/BCH_PH);
      } else {
        big.zoom = Math.max(0.25, Math.min(8, bigDrag.zoom * (1 - (p.y-bigDrag.sy)/220)));
      }
      drawBig();
    } else {
      big.cross = p; drawBig();
    }
  });
  function up(e){
    delete bigPts[e.pointerId];
    if(!Object.keys(bigPts).length){ bigDrag = null; bigPinch = null; }
  }
  box.addEventListener("pointerup", up);
  box.addEventListener("pointercancel", up);
  box.addEventListener("pointerleave", function(){ if(!Object.keys(bigPts).length){ big.cross = null; drawBig(); } });
  box.addEventListener("wheel", function(e){ e.preventDefault(); big.bars = Math.max(12, Math.min(220, Math.round(big.bars) + (e.deltaY>0?4:-4))); drawBig(); }, { passive:false });
}
function bigSpan(){
  var data = aggFor(big.sym, big.tf), len=data.length;
  var bars = Math.max(10, Math.min(Math.round(big.bars), len));
  var off = Math.max(0, Math.min(Math.round(big.offset), len-bars));
  var end = len-off, start = Math.max(0,end-bars);
  var vis = data.slice(start,end);
  var lo=Infinity, hi=-Infinity;
  vis.forEach(function(k){ if(k.l<lo) lo=k.l; if(k.h>hi) hi=k.h; });
  if(!isFinite(lo)) return 1;
  return ((hi-lo)*1.12/(big.zoom||1)) || 1;
}

/* content lookups */
function findPath(id){ for(var i=0;i<PATHS.length;i++){ if(PATHS[i].id===id) return PATHS[i]; } return null; }
function findLesson(pid,lid){ var p=findPath(pid); if(!p) return null; for(var i=0;i<p.lessons.length;i++){ if(p.lessons[i].id===lid) return p.lessons[i]; } return null; }
function pathDone(pid){ var p=findPath(pid), n=0; if(!p) return 0; if(!S.prog[pid]) return 0; for(var i=0;i<p.lessons.length;i++){ if(S.prog[pid][p.lessons[i].id] && S.prog[pid][p.lessons[i].id].done) n++; } return n; }
function lessonDone(pid,lid){ return !!(S.prog[pid] && S.prog[pid][lid] && S.prog[pid][lid].done); }
function totalLessons(){ var n=0; for(var i=0;i<PATHS.length;i++) n+=PATHS[i].lessons.length; return n; }
function totalDone(){ var n=0; for(var i=0;i<PATHS.length;i++) n+=pathDone(PATHS[i].id); return n; }

/* ---------------- Credits & Pro ---------------- */
function grantDailyCredits(){
  var t = todayStr();
  if(!S.creditDay){ S.creditDay = t; if(S.credits==null) S.credits = START_CREDITS; save(); return 0; }
  if(S.creditDay === t) return 0;
  S.creditDay = t; save();
  if(DAILY_CREDITS > 0){ S.credits = (S.credits||0) + DAILY_CREDITS; save(); }
  return DAILY_CREDITS;
}
function canQuiz(){ return !!S.pro || (S.credits||0) >= QUIZ_COST; }
function spendQuiz(){
  if(S.pro) return true;
  if((S.credits||0) < QUIZ_COST) return false;
  S.credits -= QUIZ_COST; save(); return true;
}
function chartsAllowed(){ return !!S.pro; }

/* Cash account model: opening a trade moves cash into the position as collateral,
   closing returns the collateral plus the realised P&L. */
function notionalOf(t){ return t.qty * t.entry; }
function invested(){ var s=0,i; for(i=0;i<S.open.length;i++) s += notionalOf(S.open[i]); return s; }
function pnl(t){
  var cur = price(t.sym);
  var diff = t.side==="buy" ? (cur - t.entry) : (t.entry - cur);
  return diff * t.qty;
}
function equity(){
  var eq = S.balance, i;
  for(i=0;i<S.open.length;i++){ eq += notionalOf(S.open[i]) + pnl(S.open[i]); }
  return eq;
}
function unitName(market){ return market==="forex" ? "units" : market==="crypto" ? "coins" : "shares"; }
function settleTrade(t, reason){
  var v = pnl(t);
  t.pnl = v; t.closedAt = Date.now(); t.reviewed = false; t.followed = null;
  t.reason = reason || "Closed"; t.closePrice = price(t.sym);
  S.balance += notionalOf(t) + v;   // return collateral + realised P&L
  return v;
}
/* Close anything that has crossed its stop or target, and enforce the day-trade rule. */
function checkStops(){
  var changed=false, i, notes=[];
  for(i=S.open.length-1;i>=0;i--){
    var t=S.open[i];
    if(t.path==="day" && new Date(t.opened).toDateString()!==new Date().toDateString()){
      var vd=settleTrade(t,"Same-day rule"); S.open.splice(i,1); S.closed.push(t); changed=true;
      notes.push("Day trade closed at end of day ("+(vd>=0?"+":"")+money(vd)+")");
    }
  }
  for(i=S.open.length-1;i>=0;i--){
    var tr=S.open[i], p=price(tr.sym), hit=null;
    if(tr.stop && ((tr.side==="buy" && p<=tr.stop) || (tr.side==="sell" && p>=tr.stop))) hit="Stop hit";
    else if(tr.target && ((tr.side==="buy" && p>=tr.target) || (tr.side==="sell" && p<=tr.target))) hit="Target hit";
    if(hit){
      var vv=settleTrade(tr,hit); S.open.splice(i,1); S.closed.push(tr); changed=true;
      notes.push(tr.sym+" "+hit+" "+(vv>=0?"+":"")+money(vv));
    }
  }
  if(changed){ save(); for(i=0;i<Math.min(notes.length,3);i++) toast(notes[i]); }
  return changed;
}

/* streak */
function touchStreak(){
  var t = todayStr();
  if(S.streak.last === t) return;
  var y = new Date(Date.now()-86400000); var ys = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  if(S.streak.last === ys) S.streak.count += 1; else S.streak.count = 1;
  S.streak.last = t; save();
}

function toast(msg){
  var b = document.createElement("div");
  b.className = "banner toast-up"; b.textContent = msg;
  document.body.appendChild(b);
  setTimeout(function(){ b.style.opacity="0"; b.style.transition="opacity .3s"; }, 2200);
  setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 2600);
}

/* ---------- Quiz engine ---------- */
function buildQuiz(mode, pid, lid, items){
  var qs, src;
  if(mode==="lesson"){ var l=findLesson(pid,lid); qs = l.quiz.slice(); src=qs; }
  else { qs = items.slice(); src=qs; }
  quizState = { mode:mode, pid:pid, lid:lid, qs:qs, i:0, score:0, answered:false, chosen:null, missed:[], items:items||null };
  setRoute({s:(mode==="lesson"?"quiz":mode)});
}

function quizView(){
  if(!quizState) return '<p>No quiz loaded.</p>';
  var q = quizState.qs[quizState.i];
  var total = quizState.qs.length;
  var cost = quizState.mode==="lesson" ? (S.pro?" · Pro" : "") : "";
  var label = quizState.mode==="daily"?"DAILY QUIZ" : quizState.mode==="review"?"REVIEW" : "LESSON QUIZ";
  var html = '<div class="between"><span class="small muted">'+label+cost+'</span><span class="pill">'+(quizState.i+1)+' / '+total+'</span></div>';
  html += '<div class="bar"><i style="width:'+Math.round(quizState.i/total*100)+'%"></i></div>';
  html += '<h2 style="margin-top:14px">'+esc(q.q)+'</h2>';
  html += q.o.map(function(o,i){
    var cls = "opt";
    if(quizState.answered){
      if(i===q.a) cls += " correct";
      else if(i===quizState.chosen) cls += " wrong";
    }
    var dis = quizState.answered? "disabled":"";
    return '<button class="'+cls+'" '+dis+' onclick="A.answer('+i+')">'+esc(o)+'</button>';
  }).join("");
  if(quizState.answered){
    html += '<div class="explain"><b>'+(quizState.chosen===q.a?"✅ Correct":"❌ Not quite")+'</b><br>'+esc(q.e)+'</div>';
    var last = quizState.i === total-1;
    html += '<button id="nextBtn" class="btn primary sticky" onclick="A.nextQ()">'+(last?"See results →":"Next question →")+'</button>';
  }
  return html;
}

function symbolView(sym){

  var lo = Math.min.apply(null, cs.map(function(k){return k.l;}));
  var prev = cs.length>1 ? cs[cs.length-2].c : cur;
  var chg = prev ? (cur-prev)/prev*100 : 0;
  var open = S.open.filter(function(t){ return t.sym===sym; });
  var pos = open[0];
  var html = '<h2>'+esc(m.name)+' <span class="tag">'+esc(sym)+'</span></h2>';
  html += '<p class="muted" style="margin-top:-8px">'+esc(m.market)+" · <span class=\"dim\">practice candles, not live data</span></p>";
  html += '<div class="card"><div class="between"><div><div class="small muted">LAST</div><div style="font-size:28px;font-weight:800">'+fmt(cur,m.dec)+'</div></div>'+
    '<div style="text-align:right"><div class="small muted">change</div><div class="'+ (chg>=0?"good":"bad") +'" style="font-weight:800">'+(chg>=0?"+":"")+fmt(chg,2)+'%</div></div>'+
    '<button class="btn primary" style="width:auto;padding:10px 16px;margin:0" onclick="A.ticketFor(\''+sym+'\')">Trade</button></div>'+
    candleChart(sym, {h:230, entry: pos&&pos.entry, stop: pos&&pos.stop, target: pos&&pos.target})+
    '<div class="chartkey"><span class="k up"></span> up'+
      '<span class="k dn"></span> down'+
      (pos? ' <span class="k lv"></span> entry / target' + (pos.stop?' <span class="k sl"></span> stop':'') : '')+
    '</div>'+
    (pos
      ? '<div class="small muted">Your open '+esc(pos.side)+' is drawn on the chart \u2014 entry '+fmt(pos.entry,m.dec)+(pos.stop?', stop '+fmt(pos.stop,m.dec):'')+(pos.target?', target '+fmt(pos.target,m.dec):'')+'.</div>'
      : '<div class="small muted">Set a stop and target on a trade to see them drawn here.</div>')+
    '<div class="between small muted" style="margin-top:8px"><span>54 candles \u00b7 range</span><span>'+fmt(lo,m.dec)+' \u2014 '+fmt(hi,m.dec)+'</span></div>'+
    '</div>';

  if(open.length){
    html += '<h3>Your open positions</h3>'+open.map(positionRow).join("");

    '<button class="btn ghost" onclick="A.openChart(\''+sym+'\')">Full chart</button></div>';

/* ---------- Journal ---------- */
function journalView(){
  var wins=0, total=0, sumPnl=0;
  for(var i=0;i<S.closed.length;i++){ var t=S.closed[i]; total++; sumPnl+=t.pnl; if(t.pnl>0) wins++; }
  var wr = total? Math.round(wins/total*100):0;
  var followPct = S.followStats.total? Math.round(S.followStats.followed/S.followStats.total*100):0;
  var html = '<h2>Journal</h2><p class="muted" style="margin-top:-8px">Every closed paper trade, with a plan check.</p>';

    '<div class="kpi"><div class="k">Total P&L</div><div class="v '+(sumPnl>=0?"good":"bad")+'" style="font-size:17px">'+(sumPnl>=0?"+":"")+money(sumPnl)+'</div></div>'+
    '<div class="kpi"><div class="k">Plan followed</div><div class="v">'+followPct+'%</div></div>'+
    '<div class="kpi"><div class="k">Lessons done</div><div class="v">'+totalDone()+'/'+totalLessons()+'</div></div>'+
    '</div>';
  html += '<div style="height:12px"></div>';
  if(!S.closed.length){
    html += '<div class="card center lock"><div style="font-size:28px">📓</div><div class="muted">No closed trades yet. Close a practice trade in Charts and it lands here.</div><button class="btn ghost" onclick="A.go(\'lab\')">Go to Charts</button></div>';
    return html;
  }
  html += S.closed.slice().reverse().map(function(t){
    var m = symMeta(t.sym);
    var needReview = !t.reviewed;
    return '<div class="card">'+
      '<div class="between"><div class="grow"><b>'+esc(t.sym)+'</b> <span class="pill gray">'+esc((findPath(t.path)||{}).name||t.path)+'</span></div>'+
      '<b class="'+(t.pnl>=0?"good":"bad")+'">'+(t.pnl>=0?"+":"")+money(t.pnl)+'</b></div>'+
      '<div class="small muted" style="margin-top:6px">'+t.side.toUpperCase()+' '+t.qty+' · entry '+fmt(t.entry,m.dec)+' · stop '+(t.stop?fmt(t.stop,m.dec):"—")+' · target '+(t.target?fmt(t.target,m.dec):"—")+'</div>'+
      '<div class="small muted">Result: <b class="'+(t.pnl>=0?"good":"bad")+'">'+(t.pnl>=0?"Win":"Loss")+'</b>'+(t.reason?' · '+esc(t.reason):'')+(t.reviewed?' · Followed plan: <b>'+(t.followed?"Yes":"No")+'</b>':'')+'</div>'+
      (needReview? '<div style="height:8px"></div><button class="btn primary" style="padding:11px;margin:0" onclick="A.jrStart(\''+t.id+'\')">Answer 2 questions about this trade</button>' : '')+
      '</div>';
  }).join("");
  return html;
}

function journalReviewView(id){
  var t=null; for(var i=0;i<S.closed.length;i++){ if(S.closed[i].id===id) t=S.closed[i]; }

  answer: function(i){
    if(!quizState || quizState.answered) return;
    var q = quizState.qs[quizState.i];
    quizState.answered=true; quizState.chosen=i;
    if(i===q.a){ quizState.score++; } else { quizState.missed.push(quizState.i); }
    render();
  },
  nextQ: function(){
    var qs = quizState.qs;
    if(quizState.i < qs.length-1){ quizState.i++; quizState.answered=false; quizState.chosen=null; render(); return; }
    // finish
    var total = qs.length, correct = quizState.score;
    var pct = Math.round(correct/total*100), pass = pct>=80;
    var mode = quizState.mode, pid = quizState.pid, lid = quizState.lid;
    var missedCount = quizState.missed.length;
    var reward=0;
    if(mode==="lesson"){
      if(!S.prog[pid]) S.prog[pid]={};
      var wasDone = lessonDone(pid, lid);
      // record missed questions for spaced review (whether passed or not)
      for(var k=0;k<quizState.missed.length;k++){
        var qi = quizState.missed[k];
        var exists = S.reviews.some(function(rr){ return rr.pid===pid && rr.lid===lid && rr.qi===qi; });
        if(!exists) S.reviews.push({pid:pid, lid:lid, qi:qi});
      }
      if(pass){
        S.prog[pid][lid] = {score:pct, done:true};
        if(!wasDone){ S.balance += LESSON_REWARD; reward = LESSON_REWARD; }   // +$100 first time only
      }
      touchStreak();
    } else if(mode==="review"){
      // remove correctly answered items
      var items = quizState.items;
      var keep = [];
      for(var m=0;m<items.length;m++){
        var isMissed = quizState.missed.indexOf(m)>=0;
        if(isMissed) keep.push(items[m]);
      }
      S.reviews = S.reviews.filter(function(r){ return !(items.some(function(it){ return it.pid===r.pid && it.lid===r.lid && it.qi===r.qi; })); }).concat(keep);
      touchStreak();
    } else if(mode==="daily"){
      S.daily.date = todayStr(); S.daily.done = true; touchStreak();
    }
    save();
    quizState = null;
    stack.pop(); // remove quiz route
    stack.push({s:"result", score:pct, pass:pass, correct:correct, total:total, missed:missedCount, reward:reward, again:(!pass && mode==="lesson"), pid:pid, lid:lid, mode:mode});
    render();
  },

  chartZoom: function(dir){ big.bars = Math.max(12, Math.min(220, Math.round(big.bars*(dir>0?1.3:1/1.3)))); drawBig(); },

  calcRisk: function(){
    var path=(($("f_path")||{}).value)||"investing";
    var sym=(($("f_sym")||{}).value)||"AAPL";
    var qty=parseFloat(($("f_qty")||{}).value)||0;
    var entry=parseFloat(($("f_entry")||{}).value)||0;
    var stop=parseFloat(($("f_stop")||{}).value)||0;
    var target=parseFloat(($("f_target")||{}).value)||0;
    var out=$("riskOut"), msg=$("riskMsg");
    if(!out) return;
    // live candlestick chart with the stop / target drawn on it
    var ch=$("ticketChart");
    if(ch){ ch.innerHTML = candleChart(sym, {h:200, entry:entry||null, stop:stop||null, target:target||null}); }
    var cn=$("chartName"); if(cn) cn.textContent = sym;
    var lg=$("chartLegend");
    if(lg) lg.textContent = (stop||target) ? "Blue dashed = take profit \u00b7 grey dashed = stop loss." : "Set a stop and target \u2014 they appear on the chart as you type.";
    var req = path!=="investing";
    var sr=$("stopReq"); if(sr) sr.textContent = req? "(required)" : "(optional)";
    var dn=$("dayNote"); if(dn) dn.style.display = path==="day"?"block":"none";
    if(!qty || !entry){ out.textContent="—"; msg.textContent="Fill in quantity and entry."; return; }
    var cost = qty*entry;
    var costLine = "Costs "+money(cost)+" of your "+money(S.balance)+" cash.";
    var over = cost > S.balance ? ' <b class="bad">More than your cash balance.</b>' : '';
    if(!stop){
      out.textContent = req? "Stop required" : "$0.00 (investing hold)";
      out.className = req? "bad":"accent";
      msg.innerHTML = esc(costLine) + (req? " Trading paths require a stop loss." : " Investing holds do not require a stop.") + over;
      return;
    }
    var risk = Math.abs(entry-stop)*qty;
    out.textContent = money(risk);
    out.className = "accent";
    var limit = equity()*0.01;
    msg.innerHTML = esc(costLine) + " Max 1% risk = " + money(limit) + "." + over
      + (risk > limit ? ' <b class="bad">Risk is over 1%.</b>' : '');
  },
  submitTrade: function(){
    var path=($("f_path")||{}).value||"investing";
    var sym=($("f_sym")||{}).value||"AAPL";
    var side=($("f_side")||{}).value||"buy";
    var qty=parseFloat(($("f_qty")||{}).value)||0;
    var entry=parseFloat(($("f_entry")||{}).value)||0;
    var stop=parseFloat(($("f_stop")||{}).value)||0;
    var target=parseFloat(($("f_target")||{}).value)||0;
    var why=($("f_why")||{}).value||"other";
    var note=($("f_note")||{}).value||"";
    if(qty<=0){ toast("Quantity must be more than 0."); return; }
    if(entry<=0){ toast("Entry price is required."); return; }
    var req = path!=="investing";
    if(req && !stop){ toast("This path requires a stop loss."); return; }
    if(req){
      if(side==="buy" && stop>=entry){ toast("For a long, the stop must be below entry."); return; }
      if(side==="sell" && stop<=entry){ toast("For a short, the stop must be above entry."); return; }
      var risk=Math.abs(entry-stop)*qty;
      if(risk > equity()*0.01){
        toast("Risk "+money(risk)+" exceeds 1% ("+money(equity()*0.01)+"). Reduce size or tighten stop.");
        return;
      }
    } else {
      if(target && side==="buy" && target<=entry){ toast("Target should be above entry for a long."); return; }
      if(target && side==="sell" && target>=entry){ toast("Target should be below entry for a short."); return; }
    }
    if(!chartsAllowed()){ toast("Charts is a Pro feature."); setRoute({s:"pro"}); return; }
    var notion = qty * entry;
    if(notion > S.balance){
      toast("Not enough practice cash. This trade needs "+money(notion)+" and you have "+money(S.balance)+".");
      return;
    }
    var t = { id:"t"+Date.now()+Math.floor(Math.random()*999), sym:sym, side:side, qty:qty, entry:entry,
      stop: stop||null, target: target||null, why:why, note:note, path:path, risk: req?Math.abs(entry-stop)*qty:0,
      opened: Date.now() };
    S.open.push(t); S.balance -= notion; save();   // cash moves into the position
    toast("Practice trade opened. "+money(notion)+" committed.");
    goTab("lab");
    setRoute({s:"position", id:t.id});
  },
