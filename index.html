/* ---- daily & review launchers ---- */
function startDaily(){
  if(S.daily && S.daily.date===todayStr() && S.daily.done){
    toast("You already did today's quiz. A new one unlocks tomorrow.");
    goTab("home"); return;
  }
  var pool=[];
  for(var i=0;i<PATHS.length;i++){ var p=PATHS[i]; for(var j=0;j<p.lessons.length;j++){ var l=p.lessons[j]; for(var k=0;k<l.quiz.length;k++){ pool.push({pid:p.id, lid:l.id, q:l.quiz[k]}); } } }
  var r = rng(hash(todayStr()));
  // shuffle deterministically
  for(var m=pool.length-1;m>0;m--){ var n=Math.floor(r()*(m+1)); var tmp=pool[m]; pool[m]=pool[n]; pool[n]=tmp; }
  var picked = pool.slice(0,5);
  var qs = picked.map(function(x){ return x.q; });
  quizState = { mode:"daily", pid:null, lid:null, qs:qs, i:0, score:0, answered:false, chosen:null, missed:[], items:null };
  setRoute({s:"daily"});
}
function startReview(){
  if(!S.reviews.length) return;
  var items = S.reviews.slice(0,10);
  var qs=[];
  for(var i=0;i<items.length;i++){
    var l = findLesson(items[i].pid, items[i].lid);
    if(l && l.quiz[items[i].qi]) qs.push(l.quiz[items[i].qi]);
    else items.splice(i,1), i--;
  }
  if(!qs.length){ toast("Nothing to review."); goTab("home"); return; }
  quizState = { mode:"review", pid:null, lid:null, qs:qs, i:0, score:0, answered:false, chosen:null, missed:[], items:items };
  setRoute({s:"review"});
}

function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }
function hashPw(pw){
  var salt = "fortuna:local:v1:" + pw + ":fortuna";
  var h1 = 0x811c9dc5 >>> 0, h2 = 0x9e3779b9 >>> 0;
  for(var i=0;i<salt.length;i++){
    var c = salt.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = Math.imul(h2 ^ (c * 31 + i), 2654435761) >>> 0;
  }
  return h1.toString(16) + h2.toString(16);
}

var KB = null;
function buildKB(){
  if(KB) return KB;
  KB = [];
  PATHS.forEach(function(p){
    p.lessons.forEach(function(l){
      KB.push({ pid:p.id, lid:l.id, pname:p.name, title:l.title,

    });
  });

}
var STOPW = {the:1,a:1,an:1,and:1,or:1,is:1,are:1,was:1,to:1,of:1,in:1,on:1,for:1,it:1,my:1,i:1,you:1,do:1,does:1,what:1,how:1,can:1,should:1,me:1,about:1,explain:1,this:1,that:1,with:1,be:1,at:1,if:1,so:1,why:1,when:1,which:1,tell:1,mean:1,means:1};
function kbSearch(q){
  var toks = q.toLowerCase().replace(/[^a-z0-9%\s]/g," ").split(/\s+/).filter(function(w){ return w.length>2 && !STOPW[w]; });
  if(!toks.length) return null;
  var best=null, bestScore=0;
  buildKB().forEach(function(item){
    var s=0, title=item.title.toLowerCase();
    toks.forEach(function(tk){
      if(title.indexOf(tk)>=0) s+=3;
      var idx=item.text.indexOf(tk);
      while(idx>=0){ s++; idx=item.text.indexOf(tk, idx+tk.length); }
    });
    if(s>bestScore){ bestScore=s; best=item; }
  });
  return bestScore>0 ? best : null;
}

function lessonSnippet(pid,lid){
  var l = findLesson(pid,lid); if(!l) return "";
  var s = l.pages[0];

function fortunaAnswer(q){
  var t = (q||"").toLowerCase().trim();
  if(!t) return {text:"Ask me anything about the lessons \u2014 for example, \u201cwhat is a stop loss?\u201d or \u201chow much is 1% risk?\u201d", link:null};
  if(/^(hi|hey|hello|yo|sup|good (morning|evening|afternoon))/.test(t)) return {text:"Hey! Ask me about a term, a rule, or any lesson in Fortuna.", link:null};
  if(/(who are you|what can you do|how do you work|help me)/.test(t)) return {text:"I answer questions using Fortuna\u2019s course library \u2014 stop losses, position sizing, pips, leverage, ETFs, stablecoins, risk-to-reward, and more. I can also do quick risk math, like \u201c2% of 25000\u201d.", link:null};
  var m = t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:of|on|from)?\s*\$?([\d,]+(?:\.\d+)?)/);
  if(m){
    var pct = parseFloat(m[1]), base = parseFloat(m[2].replace(/,/g,""));
    if(base>0 && pct<=100){
      var amt = base*pct/100;
      return {text:pct+"% of $"+base.toLocaleString()+" is $"+amt.toLocaleString(undefined,{maximumFractionDigits:2})+". On a trading path that is the most you should lose if your stop is hit \u2014 size the position from it.",
        link: pct===1 ? {pid:"swing",lid:"sw3",title:"The 1% risk rule"} : null};
    }
  }
  if(/(how much|what).*(risk|can i lose)|risk per trade/.test(t)){
    var lim = S.balance*0.01;
    return {text:"With a $"+Math.round(S.balance).toLocaleString()+" practice account, your 1% risk limit is $"+lim.toFixed(2)+" per trade.", link:{pid:"swing",lid:"sw3",title:"The 1% risk rule"}};
  }
  var gb=null, glen=0;
  GLOSS.forEach(function(g){ g.k.forEach(function(kw){ if(t.indexOf(kw)>=0 && kw.length>glen){ glen=kw.length; gb=g; } }); });
  if(gb) return {text:gb.a, link:{pid:gb.pid, lid:gb.lid, title:(findLesson(gb.pid,gb.lid)||{}).title||"Lesson"}};
  var r = kbSearch(t);
  if(r) return {text:"Here is the closest match in the course: \u201c"+r.title+"\u201d ("+r.pname+"). "+lessonSnippet(r.pid,r.lid), link:{pid:r.pid,lid:r.lid,title:r.title}};
  return {text:"I did not find that in the lessons. Try a term or rule \u2014 stop loss, 1% rule, pips, leverage, ETF, stablecoin, risk-to-reward \u2014 or browse the Learn tab.", link:null};
}
